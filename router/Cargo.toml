[package]
name = "signer-router"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Web3Signer-compatible remote signer that routes eth2 signing duties to hardware wallets"

[[bin]]
name = "signer-router"
path = "src/main.rs"

[lib]
name = "signer_router"
path = "src/lib.rs"

[dependencies]
signer-device = { path = "../device" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }
thiserror = { workspace = true }
hex = { workspace = true }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
# O_NOFOLLOW / geteuid for opening secret files (already in the lock tree).
libc = "=0.2.191"

[dev-dependencies]
signer-device = { path = "../device", features = ["test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
signer-core = { workspace = true }
proptest = "1"
# E2: re-wrap test secrets as EIP-2335 keystores (the versions signer-device
# already uses; no new crate in the lock).
sha2 = { workspace = true }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = "0.8"
ctr = "0.9"
