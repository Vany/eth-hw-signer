[package]
name = "signer-router"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Web3Signer-compatible remote signer that routes eth2 signing duties to hardware wallets"

[[bin]]
name = "signer-router"
path = "src/main.rs"

[lib]
name = "signer_router"
path = "src/lib.rs"

[dependencies]
signer-device = { path = "../device" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
hex = { workspace = true }
signer-core = { workspace = true }
