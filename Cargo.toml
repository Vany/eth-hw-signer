[workspace]
resolver = "2"
members = ["device", "core"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/Vany/eth-hw-signer"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# sha2/hmac/zeroize are shared with signer-core, which is no_std: keep the
# RustCrypto crates' default (std) features off so both builds share one
# feature resolution.
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
zeroize = { version = "1", default-features = false }
blst = "0.3"
hex = "0.4"
thiserror = "2"
signer-core = { path = "core" }

[profile.release]
lto = true
