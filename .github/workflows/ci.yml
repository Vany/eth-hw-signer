name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  core-no-std:
    name: signer-core no_std (Cortex-M33, thumbv8m.main-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Without the `bls` feature: blst compiles C and needs an
      # arm-none-eabi C toolchain for bare-metal targets.
      - run: rustup target add thumbv8m.main-none-eabihf
      - run: cargo build -p signer-core --locked --target thumbv8m.main-none-eabihf --no-default-features
