name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild-image:
        description: "Rebuild the dev image even if its tag already exists"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/vany/eth-hw-signer-dev

jobs:
  # The dev image (docker/dev.Dockerfile) is built once per content of
  # docker/dev.Dockerfile + rust-toolchain.toml: the tag is their hash. If the
  # tag is already in the registry, this job only reports it; every other job
  # runs inside that image and installs nothing.
  image:
    name: dev image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          tag=$(cat docker/dev.Dockerfile rust-toolchain.toml | sha256sum | cut -c1-16)
          echo "ref=$IMAGE:$tag" >> "$GITHUB_OUTPUT"
          echo "dev image: $IMAGE:$tag"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if [ "${{ inputs.rebuild-image }}" != "true" ] && docker manifest inspect "${{ steps.tag.outputs.ref }}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "already in the registry, not rebuilding"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.build == 'true' && github.event_name != 'pull_request'
        run: |
          docker build -f docker/dev.Dockerfile -t "${{ steps.tag.outputs.ref }}" -t "$IMAGE:latest" .
          docker push "${{ steps.tag.outputs.ref }}"
          docker push "$IMAGE:latest"

  test:
    name: cargo test (host)
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version && cargo test --workspace --locked

  core-m33:
    name: signer-core for Cortex-M33 (thumbv8m.main-none-eabihf, with BLS)
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p signer-core --locked --target thumbv8m.main-none-eabihf
      - run: cargo build -p signer-core --locked --target thumbv8m.main-none-eabihf --no-default-features
